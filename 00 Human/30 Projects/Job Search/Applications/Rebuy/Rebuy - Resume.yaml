target_title: "VP, Engineering"
target_subtitle: "Engineering Leadership | Platform Strategy | AI Integration"

summary: >-
  An engineering leader who scales both the org and the API-first platform under it. Grew one team
  of 8 into five cross-functional teams of 40-plus behind a platform serving millions, and delivered
  a multi-tenant AWS platform from zero to production in under 90 days. Now ships agentic, REST
  API-driven systems in governed production, and has been the sole technology voice through PE and
  board diligence.

achievements:
  - label: "Org From One Team To Five"
    text: "Grew one team of 8 into five cross-functional teams of 40-plus across time zones, built the manager-of-managers layer, and lifted retention 15 percent with career ladders and structured feedback."
  - label: "Platform Zero To Production"
    text: "Delivered a revenue-critical, multi-tenant platform on AWS from zero to production in under 90 days, protecting an 8-figure revenue line through a post-divestiture reset."
  - label: "Agentic AI In Delivery"
    text: "Moved agentic and LLM-backed systems from pilot to governed production, standardizing reusable API tools, an OpenAPI-documented surface, and guardrails so a lean team ships AI that holds up instead of slop."
  - label: "Diligence-Ready Standards"
    text: "Held high availability across 100-plus high-traffic properties while setting the architecture and security standards that survived PE and board diligence, maturing SRE, observability, and automated CI/CD."

