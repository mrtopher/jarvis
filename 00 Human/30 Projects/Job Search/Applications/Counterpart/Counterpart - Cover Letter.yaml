date: "August 23, 2026"
salutation: "Dear Mr. Hackett,"

paragraphs:
  - >-
    I am an engineering leader who came up building software and now builds the org around it. Your
    posting is not asking for someone who adopted a few AI tools. It is asking for someone with a real
    point of view on what AI-native engineering is, who knows where it earns its keep and where the
    hype outruns it. That is the work I do every day, and it is the version of it that matters here.
  - >-
    At Dual Logic I run delivery with agentic and LLM-backed systems in governed production, real
    components with guardrails and evaluation, where agents carry the repeatable work and engineers
    keep context and ownership. That is your "the system carries the rest" model, built and running. I
    also draw the line clearly. AI makes strong engineers stronger, and shipping software fast is not
    the same as shipping software that holds up. I will not ship you slop and call it speed.
  - >-
    I have scaled the org underneath that kind of ambition. At Industry Dive I grew one team of 8 into
    five cross-functional teams of 40-plus and built the manager-of-managers layer so ownership and
    standards survived the growth. I know what structures break as a company outgrows a stage, because I
    have been the one to rebuild them. At Pipeline 360 I shipped a multi-tenant AWS platform from zero
    to production in under 90 days, and I was the sole technology voice in PE and board diligence. I
    built SOC 2 controls into that architecture rather than bolting them on late, which is the same way
    I would treat HIPAA and state cybersecurity rules at Counterpart.
  - >-
    I have not run an insurance platform, so I will not pretend the domain is second nature yet. What I
    have done is own security and compliance under real revenue pressure, scale engineering through hard
    change, and manage a budget down to cloud cost. I learn a new domain fast and in the open, shipping
    as I go.
  - >-
    I would welcome a conversation about where you want Counterpart's engineering org and its agent
    foundation to go, and how I would help build it.

closing: "Sincerely,"
signer: "Chris Monnat"
