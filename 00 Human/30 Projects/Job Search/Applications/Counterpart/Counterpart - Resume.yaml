target_title: "VP of Engineering"
target_subtitle: "Engineering Leadership | AI Strategy | Organizational Design"

summary: >-
  I came up writing code and never stopped caring how the work actually ships. Over twenty years I
  have built engineering orgs that move fast without cutting the corners that come back to bite you.
  Now I run delivery where agents handle the repeatable work and engineers keep the judgment, so a
  lean team compounds output instead of drowning in it. Known for treating speed and quality as the
  same problem.

achievements:
  - label: "Agents That Compound Output"
    text: "Put agentic and LLM-backed systems into governed production with reusable components, evaluation harnesses, and guardrails, so a lean team ships more real software without shipping slop."
  - label: "Org From One Team To Five"
    text: "Grew one team of 8 into five cross-functional teams of 40-plus across time zones, built the manager-of-managers layer, and lifted retention 15 percent with career ladders and structured feedback."
  - label: "Platform Zero To Production"
    text: "Delivered a revenue-critical, multi-tenant platform on AWS from zero to production in under 90 days, protecting an 8-figure revenue line through a post-divestiture reset."
  - label: "Board And Compliance"
    text: "Served as the sole technology voice in PE investor and board diligence, and set architecture and security standards, including SOC 2, that held up under review instead of being bolted on late."

