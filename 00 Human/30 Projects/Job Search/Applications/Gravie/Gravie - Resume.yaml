target_title: "Vice President, Platform & Architecture"
target_subtitle: "Platform Strategy | AI Strategy | Software Architecture"

summary: >-
  Good platform work is quiet, where other teams move faster and break less and nobody thinks
  about why. That is what I build, and I build it hands-on: shared foundations and standards that
  keep an engineering org fast and reliable. Today I am building the AI platform that puts agents
  and LLMs into governed production with guardrails and evaluation. AI should make strong engineers
  stronger, not bury them in slop.

achievements:
  - label: "Agentic Dev Adoption"
    text: "Drove agentic development across an 800-plus-employee engineering org, standardizing reusable agent skills, evaluation, and guardrails, and tracked the productivity lift in delivery metrics."
  - label: "AI Platform In Production"
    text: "Built the foundations for AI in customer-facing systems with secure model access, agent orchestration, retrieval, evaluation, observability, and guardrails, moving LLM-backed work from pilots into governed production."
  - label: "Paved-Road Platform"
    text: "Built a shared paved-road platform that cut average time-to-ship 35 percent across 100-plus properties, spreading one reusable delivery pattern instead of letting teams rebuild."
  - label: "Reliability Reset"
    text: "Reset a revenue-critical multi-tenant platform to production and held it reliable at volume in under 90 days on AWS, protecting an 8-figure revenue line through a post-divestiture reset."

