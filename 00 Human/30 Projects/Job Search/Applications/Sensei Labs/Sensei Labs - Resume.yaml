target_title: "Vice President, Engineering"
target_subtitle: "Engineering Leadership | AI Strategy | Platform Modernization"

summary: >-
  Engineering leader who came up through architecture and still ships code, most at home as a
  hands-on player-coach. Made AI-assisted development the default across the SDLC, so a lean team
  ships daily without shipping slop. Delivered a revenue-critical platform from zero to production
  in under 90 days. Known for building teams and platforms that ship fast without cutting corners.

achievements:
  - label: "AI as the Default"
    text: "Made AI-assisted development the default across an 800-employee org, replacing scattered one-off scripts with a shared platform of reusable agent skills, evaluation harnesses, and review gates that hold quality as code volume climbs."
  - label: "Zero to Production"
    text: "Delivered a revenue-critical multi-tenant platform from zero to production in under 90 days, holding reliability and security while protecting an 8-figure revenue line through a post-divestiture reset."
  - label: "Trusted AI in Production"
    text: "Shipped agentic and RAG-backed systems from architecture through governed production, pairing evaluation and guardrails with a human review loop so AI stays reliable under real enterprise use."
  - label: "Hands-On Leadership"
    text: "Stayed in the code and the reviews while growing one team of 8 into five cross-functional squads of 40-plus, and cut average time-to-ship 35 percent with a paved-road delivery platform."

