date: "August 10, 2026"
salutation: "Dear D'Arcy,"

paragraphs:
  - >-
    The VP seat you are describing wants someone who can make a lean team deliver far beyond its
    size, mostly by rebuilding how it works with AI. That is the work I do now. As CTO of an AI
    consulting practice, I moved AI-assisted development from scattered scripts into a shared platform
    of agent skills, evals, and review gates that hold quality as code volume climbs. I read the
    hands-on part as the best part, not a caveat. I am most useful in the code, the reviews, and the
    architecture calls, and I have run small teams that way.
  - >-
    Conductor Modern is a delivery problem I have lived. I took a revenue-critical platform from zero
    to production in under 90 days, owning the service boundaries, data isolation, and the security
    posture an enterprise buyer expects, then founded and consolidated the platform behind more than
    100 properties through a post-acquisition integration without dropping uptime. Harmony is the
    part I would be most excited to push on, since I have carried agentic and RAG-backed systems from
    architecture through governed production with the evals and guardrails that keep AI trustworthy
    for enterprise users.
  - >-
    I will be straight about the stretch. My cloud depth is AWS and GCP rather than Azure, and the
    PPM domain is new to me, but architecture carries across clouds and I close domain gaps by getting
    into the product. On the parts that matter most here, AI-first delivery and hands-on leadership, I
    am already there. I would welcome a conversation about running engineering for Conductor as you
    finish the rewrite and grow the team.

closing: "Sincerely,"
signer: "Chris Monnat"
