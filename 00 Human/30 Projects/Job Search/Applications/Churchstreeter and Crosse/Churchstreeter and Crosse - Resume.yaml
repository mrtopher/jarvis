target_title: "Chief Technology Officer"
target_subtitle: "AI Strategy | Software Product Development | Engineering Leadership"

summary: >-
  Hands-on technology executive who came up through architecture and never left the code.
  Runs the implementation side of an AI consulting practice today, building agentic and
  LLM-backed products for enterprise clients while leading strategy, delivery, and the
  teams that ship them. Takes products from concept to commercial launch: at Pipeline 360
  shipped a revenue-critical platform from zero to production in under 90 days, protecting
  an 8-figure line, and at Industry Dive scaled one team of 8 into five teams of 40+
  serving 100+ properties used by millions. Built the Product Management function from
  scratch and cut time-to-ship 35%. Known for turning an executive's AI vision into
  working software fast, without letting quality, security, or the people slip.

achievements:
  - label: "Concept to Commercial in 90 Days"
    text: "Shipped a revenue-critical platform from zero to production in under 90 days, protecting an 8-figure line through a post-divestiture reset without loosening security or reliability."
  - label: "AI Built at the Code Level"
    text: "Build agentic and LLM-backed systems for enterprise clients hands-on while leading strategy and delivery, so product decisions come from someone still in the weeds."
  - label: "Scaled an Elite Engineering Org"
    text: "Grew 1 team of 8 into 5 cross-functional teams of 40+ across time zones, standing up the delivery model and the Product Management function that made new products repeatable."
  - label: "AI Adoption, Governed at Scale"
    text: "Drove AI-augmented tooling across an 800+ person org by turning one-off scripts into an evaluated, guardrailed platform teams trusted, holding output quality and cost in check."

