target_title: "VP, Digital Technology"
target_subtitle: "Technology Strategy | Applied AI | Platform Modernization"

summary: >-
  Consumer-scale technology leader who came up through architecture and never left the code.
  Runs the technical side of an AI consulting practice today, turning generative AI strategy
  into secure, production software for enterprise clients. Has built and run consumer-facing
  digital platforms at real scale: at Industry Dive founded and scaled the engineering
  organization behind 100-plus digital properties read by millions, and at Pipeline 360
  delivered a revenue-critical, multi-tenant platform on AWS from zero to production in under
  90 days, protecting an 8-figure line. Grew one team of 8 into five cross-functional teams of
  40-plus and lifted retention 15 percent while owning technology budget, security, and
  compliance end to end. Known for closing the gap from digital strategy to high-availability
  software without letting reliability, security, or craft slip.

achievements:
  - label: "Consumer Platforms at Scale"
    text: "Founded and scaled the engineering organization behind 100-plus consumer-facing digital properties read by millions, standing up SRE, observability, and incident response that held high availability through constant change."
  - label: "Platform Zero to Production"
    text: "Delivered a revenue-critical, multi-tenant platform on AWS from zero to production in under 90 days, protecting an 8-figure line without loosening reliability or security."
  - label: "Generative AI in Production"
    text: "Build agentic and LLM-backed systems for enterprise clients hands-on, using RAG retrieval and vector search to ship responsible, evaluated AI into real products rather than demos."
  - label: "Budget and Governance Owner"
    text: "Owned technology budget, security, and compliance end to end for a PE-backed organization, serving as the sole technology voice in investor and board diligence."

