target_title: "VP of Engineering"
target_subtitle: "Engineering Leadership | Distributed Systems | AI Strategy"

summary: >-
  Engineering leader who came up through architecture and still ships code, running cross-functional
  squads as a manager of managers. At Industry Dive, grew one team of 8 into five teams of 40-plus
  and cut time-to-ship 35 percent with a paved-road platform. At Pipeline 360, took a revenue-critical
  AWS platform from zero to production in under 90 days. Known for leveling up healthy teams without
  breaking what already works.

achievements:
  - label: "Scaled Healthy Squads"
    text: "Grew one team of 8 into five cross-functional squads of 40-plus across time zones, built the manager-of-managers layer, and lifted retention 15 percent with career ladders and clear standards."
  - label: "Platform Teams Build On"
    text: "Cut average time-to-ship 35 percent with a paved-road platform of self-service provisioning, shared services, and automated testing, then spread it across 100-plus properties so squads shipped features instead of fighting infrastructure."
  - label: "Shipped Under Pressure"
    text: "Delivered a revenue-critical multi-tenant platform on AWS from zero to production in under 90 days, holding reliability and security while protecting an 8-figure line."
  - label: "AI With Judgment"
    text: "Moved agentic and LLM-backed systems from early pilots to governed production with reusable components, evaluation harnesses, and guardrails, so a lean team ships AI that holds up in production instead of slop."

