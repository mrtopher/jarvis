target_title: "Vice President, Engineering"
target_subtitle: "Engineering Leadership | Applied AI | Team Building"

summary: >-
  Engineering runs best when one person owns it and still ships. I grew a single team of eight into
  five squads of forty, coaching engineers into leads while staying in the code and the reviews.
  Today I build governed AI on real data for enterprise clients, the kind of work that turns a large
  dataset into something people trust. A small team, pointed well, outproduces a big one.

achievements:
  - label: "Hands-On Scaling"
    text: "Grew one team of eight into five cross-functional squads of forty, coaching engineers into tech leads while staying in the code and the reviews, and lifted retention 15 percent with career ladders and structured feedback."
  - label: "AI on Real Data"
    text: "Made AI-assisted development the default across an 800-employee org, replacing scattered scripts with a shared platform of agent skills, evaluation harnesses, and review gates that hold quality as code volume climbs."
  - label: "Zero to Production"
    text: "Delivered a revenue-critical multi-tenant platform from zero to production in under 90 days, holding reliability and security while protecting an 8-figure revenue line through a post-divestiture reset."
  - label: "Impact Over Output"
    text: "Built a paved-road delivery model with self-service provisioning and automated testing that cut average time-to-ship 35 percent, shifting quality upstream so engineers owned it instead of a separate gate."

