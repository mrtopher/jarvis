target_title: "Vice President of Engineering"
target_subtitle: "Engineering Leadership | Platform Strategy | Team Building"

summary: >-
  A founding engineering leader who builds the team and the platform in the same motion. Stood up the
  engineering org at Industry Dive from one team of 8 to five of 40-plus, then delivered a
  revenue-critical, multi-tenant platform from zero to production in under 90 days. Runs cloud-native,
  event-driven systems across AWS and GCP with the security and reliability that money-movement
  demands, and stays hands-on where it counts.

achievements:
  - label: "Org Built From Zero"
    text: "Grew one team of 8 into five cross-functional teams of 40-plus, founded the Product function alongside it, built the manager-of-managers layer, and lifted retention 15 percent with career ladders and structured feedback."
  - label: "Platform Zero To Production"
    text: "Delivered a revenue-critical, multi-tenant platform on AWS from zero to production in under 90 days, protecting an 8-figure revenue line through a post-divestiture reset."
  - label: "Reliability Under Scrutiny"
    text: "Held high availability across 100-plus high-traffic properties by maturing SRE, observability, and automated CI/CD, and set the architecture and security standards that survived PE and board diligence."
  - label: "Paved-Road Delivery"
    text: "Cut average time-to-ship 35 percent with automated provisioning and testing, then spread the reusable, API-driven pattern across the broader portfolio."

