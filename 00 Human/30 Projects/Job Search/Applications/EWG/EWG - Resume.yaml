target_title: "Vice President, Engineering"
target_subtitle: "Platform Modernization | AI Strategy | Engineering Leadership"

summary: >-
  Hands-on technology executive who came up through architecture and never left the code.
  Runs the implementation side of an AI consulting practice today, modernizing legacy systems
  and building agentic, LLM-backed products for clients while leading strategy, delivery, and
  the teams that ship them. Takes aging, manual-heavy operations and turns them into modern,
  automated platforms: at Pipeline 360 shipped a revenue-critical data platform from zero to
  production in under 90 days, protecting an 8-figure line, and at Industry Dive scaled one
  team of 8 into five teams of 40+ serving 100+ properties used by millions. Known for translating
  technology strategy for non-technical leaders and funders, then delivering it without letting
  quality, security, or the people slip.

achievements:
  - label: "Data Platform in 90 Days"
    text: "Shipped a revenue-critical platform, including its data ingestion and processing, from zero to production in under 90 days, protecting an 8-figure line through a post-divestiture reset without loosening security or reliability."
  - label: "Legacy to Modern, Standards and All"
    text: "Replaced manual ticket queues with self-service provisioning and automated CI/CD, and set the testing, QA, and release standards that cut time-to-ship 35% across a 40-plus engineering org."
  - label: "AI Delivered With Guardrails"
    text: "Build agentic and LLM-backed systems hands-on, pairing automation with human review loops so AI reaches products responsibly and quality, cost, and trust hold."
  - label: "Scaled a Consumer-Scale Org"
    text: "Grew 1 team of 8 into 5 cross-functional teams of 40+ serving 100+ properties used by millions, standing up the delivery model and the Product Management function that made new work repeatable."

