  - label: "Leadership & Delivery"
    entries: "Engineering leadership, hiring and mentoring, technology roadmap, agile delivery, cross-functional leadership, board and funder communication"
  - label: "Web & App Development"
    entries: "JavaScript (React, Next.js), Python, PHP"

