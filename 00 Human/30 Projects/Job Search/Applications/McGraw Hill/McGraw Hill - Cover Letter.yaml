date: "July 16, 2026"
salutation: "Dear Hiring Team,"

paragraphs:
  - >-
    I lead product-engineering organizations that serve millions of users, and I still care about
    the craft underneath. Your posting asks for a VP who can own courseware delivery, data and
    personalization, and Sharpen across 100 to 200 engineers, set the strategy, build the leaders,
    and keep the teams shipping. That is the shape of the work I have done for years, and it is the
    scale I want to keep growing into.
  - >-
    McGraw Hill is at the part of the story I find most interesting. Digital is now the engine,
    26 million paid users and climbing, with personalization and Sharpen carrying the growth. That
    is exactly where I work. I hold a strong opinion that AI done fast is not the same as AI done
    well. AI will not replace engineers, it makes good ones stronger, and students deserve judgment
    in the product, not AI slop shipped because it was quick. A learning platform that millions of
    students trust has no room for the latter.
  - >-
    Here is what I would bring. At Industry Dive I grew one team of eight into five cross-functional
    teams of forty across time zones, leading through directors and managers to run the digital-media
    platform behind 100-plus properties used by millions. I built the Product Management function from
    zero and moved retention 15% with real career ladders and structured feedback, which matters for a
    role whose job is keeping strong engineers. At Pipeline 360 I shipped a revenue-critical, data-driven
    platform on AWS from zero to production in under 90 days, protecting an 8-figure line for a PE-backed
    business. Today I drive AI-native, personalization-heavy delivery for enterprise clients and advise
    their CEOs on the path.
  - >-
    I will be direct about two things. A 150-plus person org is a step up from the largest I have run
    directly, and higher-ed courseware is a domain I have not worked inside before. What I have done is
    lead through a manager layer, set standards across a 100-plus property portfolio, and ramp fast on
    new domains by getting close to the people who live in them. I would build the leadership bench and
    the retention systems this role needs, and I would learn your world the way I learn every new one:
    fast, and in the open.
  - >-
    I would welcome a conversation about where you want the product-engineering org and its teams to go next.

closing: "Sincerely,"
signer: "Chris Monnat"
