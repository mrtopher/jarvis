  - label: "Product & Delivery"
    entries: "Product engineering, technology roadmap, agile delivery, cross-functional partnership with product, sales, and marketing, executive and board communication"
  - label: "AI & Personalization"
    entries: "AI-native development, applied AI, agentic workflows, LLM integrations, personalization, machine learning, prompt engineering, human-in-the-loop"
