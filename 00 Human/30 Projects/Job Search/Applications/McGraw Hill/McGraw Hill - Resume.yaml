target_title: "Vice President, Software Engineering"
target_subtitle: "Engineering Leadership | Product Strategy | AI Strategy"

summary: >-
  Engineering leader who came up through architecture and never left the code. Leads
  product-engineering organizations that serve millions, setting strategy and building the
  directors, managers, and retention systems that keep teams shipping. At Industry Dive grew
  one team of 8 into five cross-functional teams of 40-plus across time zones, running the
  digital-media platform behind 100-plus properties used by millions. At Pipeline 360 delivered
  a revenue-critical, data-driven platform on AWS from zero to production in under 90 days,
  protecting an 8-figure line for a PE-backed business. Today runs the technical side of an AI
  consulting practice, shipping agentic and personalization features while advising CEOs on the
  AI-native path. Known for translating technology for non-technical leaders, then delivering it
  at scale without letting quality, accessibility, or the people slip.

achievements:
  - label: "Scaled Org, Millions of Users"
    text: "Grew one team of 8 into five cross-functional teams of 40-plus across time zones, leading through directors and managers to run a digital-media platform behind 100-plus properties used by millions."
  - label: "Platform Zero to Production"
    text: "Delivered a revenue-critical, data-driven platform on AWS from zero to production in under 90 days, protecting an 8-figure line for a PE-backed business through a post-divestiture reset."
  - label: "Retention by Design"
    text: "Built the Product Management function from zero and introduced career ladders and structured feedback that improved retention 15 percent across a 40-plus engineering org."
  - label: "AI Into Products Responsibly"
    text: "Ship agentic and personalization features hands-on, pairing automated scoring with human review loops so AI reaches products without loosening quality, cost, or trust."

