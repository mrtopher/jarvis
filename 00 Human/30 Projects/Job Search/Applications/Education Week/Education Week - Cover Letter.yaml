date: "July 16, 2026"
salutation: "Dear Ms. Givens,"

paragraphs:
  - >-
    Education Week needs a technology leader who thinks like a publisher first. The roadmap has to serve
    editorial, grow the audience, and protect the revenue that keeps the reporting independent, all at
    once. I have spent my career on exactly that stack. At Industry Dive I ran the shared platform, data,
    and delivery for 100-plus subscription media properties read by millions. I know a digital newsroom
    from the inside.
  - >-
    This role fuses CTO and CIO scope, and it favors a modern vendor ecosystem over a large in-house team.
    That is the work I do now. I run the technical side of an AI consulting practice, which means I own
    the build-versus-buy call, run procurement, manage implementation partners, and lead the knowledge
    transfer that lets a lean internal team operate a platform on its own. I set strategy for CEOs and
    boards, then translate it into budgets they can fund and defend in plain business terms.
  - >-
    On the CIO side, at Pipeline 360 I owned IT, information security, and compliance alongside
    engineering for a newly independent company, setting data governance and cybersecurity policy from a
    standing start. I also took a revenue-critical platform from zero to production in under 90 days on
    AWS, which is the kind of delivery a lean budget rewards.
  - >-
    On the AI question, I hold a firm view. AI should strengthen the newsroom and the subscription
    business, not flood it with slop. I ship AI-native workflows with human review loops, and I can defend
    each investment against its risk in terms a board understands. That is how I would approach Education
    Week's AI-enabled future: useful, responsible, and measured.
  - >-
    I would welcome a conversation about the technology and information roadmap and where you want to take
    it next.

closing: "Sincerely,"
signer: "Chris Monnat"
