target_title: "Chief Technology & Information Officer"
target_subtitle: "Technology Strategy | AI Strategy | Executive Leadership"

summary: >-
  Technology executive who came up through engineering and now runs the technical side of an AI
  consulting practice, setting strategy for CEOs and boards and translating it into budgets they can
  fund and defend. Built for a digital newsroom: at Industry Dive ran the shared platform and delivery
  for 100-plus subscription media properties read by millions, then shipped AI-driven personalization
  into the core product with a human review loop. At Pipeline 360 owned technology across engineering,
  data, IT, security, and compliance, and took a revenue-critical platform from zero to production in
  under 90 days on AWS. Grew one team of 8 into five cross-functional teams of 40-plus and lifted
  retention 15 percent. Known for running a lean team and a modern vendor ecosystem, adopting AI
  without the slop, and tying every technology call to editorial, audience, and revenue outcomes.

achievements:
  - label: "Technology for Digital Media"
    text: "Ran the shared platform, data, and delivery for 100-plus subscription media properties read by millions, holding reliability and security through constant editorial change."
  - label: "Vendor and Build vs Buy Strategy"
    text: "Own the build-versus-buy call for consulting clients, running procurement, managing implementation partners, and leading the knowledge transfer that lets a lean internal team operate a platform on its own."
  - label: "Revenue-Critical Delivery"
    text: "Took a revenue-critical, multi-tenant platform from zero to production in under 90 days on AWS, protecting an 8-figure line while owning IT, security, and compliance."
  - label: "AI Without the Slop"
    text: "Lead responsible, business-first AI adoption for clients and products, shipping AI-native workflows with human review loops instead of hype, and defending each investment in plain business terms."

competencies:
  - "Executive Leadership"
  - "Technology Leadership"
  - "Technology Strategy"
  - "AI Strategy"
  - "Product Strategy"
  - "Platform Strategy"
  - "Strategic Planning"
  - "Change Management"
  - "Organizational Design"
  - "IT Management"
  - "Enterprise IT Operations"
  - "Regulatory Compliance"
  - "Information Security"
  - "People Management"
  - "Product Leadership"

skill_groups:
  - label: "Technology & Information Leadership"
    entries: "CTO and CIO strategy, multi-year technology roadmap, IT operations, budgeting and investment planning, board and CEO communication, vendor strategy, procurement, performance accountability"
  - label: "Publishing & Subscription Platforms"
    entries: "Digital media, subscription and membership systems, paywall and audience growth, content management (CMS), CRM, marketing automation, audience analytics"
  - label: "Data, Analytics & Governance"
    entries: "Data governance, analytics and reporting platforms, data warehousing, data modeling, PostgreSQL, BigQuery"
  - label: "Security & Compliance"
    entries: "Cybersecurity, information security, web application security, data privacy, information policy, secure SDLC, regulatory compliance"
  - label: "AI & Automation"
    entries: "Applied AI, AI-native tooling, agentic workflows, LLM integrations, machine learning, prompt engineering, workflow automation, systems integration"
  - label: "Cloud & Delivery"
    entries: "AWS, GCP, CI/CD, DevOps, REST APIs, integration patterns, multi-tenant SaaS, observability, incident response"

experience:
  - company: "Dual Logic"
    location: "Remote"
    dates: "2026"
    role: "Chief Technology Officer & Managing Partner"
    summary: "Lead the technical side of a full-service AI consulting firm, owning technology strategy, vendor and build-versus-buy decisions, and delivery from discovery through production for enterprise clients."
    bullets:
      - "Set multi-year technology strategy for CEOs and technology leaders, then translate ambiguous goals into phased roadmaps and budgets they can fund and defend to a board."
      - "Own the build-versus-buy call, run procurement and vendor selection, manage implementation partners, and lead the knowledge transfer that lets a lean internal team operate a platform on its own."
      - "Lead responsible, business-first AI adoption, standing up AI-native workflows and reusable agent skills with human review loops so small teams ship continuously without loosening quality."
      - "Establish security, data governance, and delivery standards as guardrails, framing risk and investment tradeoffs in plain business terms."
  - company: "Pipeline 360"
    location: "Remote"
    dates: "2025-2026"
    role: "Sr. Vice President, Technology"
    summary: "Owned technology strategy, platform architecture, and delivery across product, engineering, data, IT, security, and compliance for a newly independent, PE-backed, 100% remote org of 100+."
    bullets:
      - "Delivered a revenue-critical, multi-tenant platform from zero to production in under 90 days on AWS, protecting an 8-figure revenue line through a post-divestiture reset."
      - "Owned IT, information security, and compliance alongside engineering, setting data governance, access, and cybersecurity policy for a newly standalone company."
      - "Made the vendor, procurement, and staffing decisions to scale capacity fast, then set the standards that kept a lean team productive as it grew."
      - "Established modern engineering practices through automated CI/CD, observability, and incident response, moving teams to self-service provisioning instead of ticket queues."
  - company: "Industry Dive / Informa TechTarget"
    location: "Washington, DC"
    dates: "2018-2025"
    role: "VP, Engineering"
    summary: "Founded and scaled the platform and product-engineering organization for a subscription digital-media publisher through post-acquisition integration."
    bullets:
      - "Ran shared platform, data, and delivery services for 100-plus subscription media properties read by millions, maturing SRE, observability, and cybersecurity to hold uptime and protect audience data through constant editorial change."
      - "Aligned the technology roadmap to editorial, audience-growth, and revenue priorities, partnering with product, editorial, and commercial leaders to sequence what shipped."
      - "Shipped AI-driven personalization and lead qualification into the core product, pairing automated scoring with a human review loop to grow audience engagement and revenue at scale."
      - "Grew one team of 8 into five cross-functional teams of 40-plus across time zones, hiring and growing senior engineers with career ladders and structured feedback that lifted retention 15 percent."
  - company: "Phone2Action"
    location: "Arlington, VA"
    dates: "2016-2017"
    role: "VP, Engineering"
    summary: "Led engineering through Series-A growth for a fast-scaling consumer SaaS, bringing planning, delivery, and reliability structure to an early-stage team."
    bullets:
      - "Brought planning, delivery, and on-call structure to a Series-A team, reaching consistent sprint predictability within 60 days without slowing momentum."
      - "Doubled the engineering team with no loss of release quality by instituting sprint cadence, code-review gates, and a clear on-call rotation across web and mobile products."
