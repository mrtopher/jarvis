target_title: "Vice President of Engineering"
target_subtitle: "Engineering Leadership | AI Strategy | Platform Modernization"

summary: >-
  Engineering leader whose strongest work is making a product better after it ships. Across two
  decades of building software the throughline has been craft: clean architecture, low defect rates,
  and systems that stay reliable long after launch. I build the management structure and technical
  standards that keep quality high as a product matures, and today I bring agentic AI into that work
  so the team raises quality faster than it raises headcount.

achievements:
  - label: "AI Transformation In Delivery"
    text: "Moved agentic and LLM-backed systems from pilots into governed production, standardizing reusable components, evaluation harnesses, and guardrails so a lean team ships AI that holds up instead of slop."
  - label: "Reliability Reset"
    text: "Reset a revenue-critical, multi-tenant platform to production and held it reliable at volume in under 90 days on AWS, protecting an 8-figure revenue line through a post-divestiture reset."
  - label: "Managers Built From Scratch"
    text: "Grew one team of 8 into five cross-functional teams of 40-plus, built the manager-of-managers layer from nothing, and lifted retention 15 percent with career ladders and structured feedback."
  - label: "Quality Over Velocity"
    text: "Held high availability across 100-plus high-traffic properties by maturing SRE, observability, and automated CI/CD, running the org on defect and reliability signals rather than raw velocity."

