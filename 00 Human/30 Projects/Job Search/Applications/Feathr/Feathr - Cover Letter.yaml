date: "August 26, 2026"
salutation: "Dear Mr. Levental,"

paragraphs:
  - >-
    You are hiring an engineering leader to harden and improve a product that already works, run the
    org by quality and customer experience, and lead the AI transformation with the org-wide Claude
    access you have opened up. That is the work I do best, and the work I find most satisfying. For a
    seat built on craftsmanship rather than headcount, that fit matters.
  - >-
    At Dual Logic I run delivery with agentic and LLM-backed systems in governed production, with real
    evaluation harnesses and guardrails, so a lean team ships more without shipping slop. I have driven
    AI-assisted development across an 800-plus employee SaaS org, turning one-off scripts into a shared,
    evaluated developer platform teams actually trusted, and tracking adoption and impact in the
    delivery metrics. That is the AI story I would bring to Feathr, not a demo.
  - >-
    Two parts of your mandate line up with my strongest work. At Pipeline 360 I came into a
    revenue-critical platform cold, reset it to reliable-at-volume in under 90 days, cut technical debt
    by consolidating siloed systems into shared services, and protected an 8-figure revenue line. At
    Industry Dive I built the engineering management layer from scratch, growing one team of 8 into five
    teams of 40-plus and coaching engineers into the tech leads and managers who ran them, with
    retention up 15 percent. Building that layer is exactly what your posting asks for.
  - >-
    I have not built for nonprofits, so I will not pretend that domain is second nature yet. What I have
    done is run engineering under real revenue and reliability pressure, tie technical decisions to
    customer experience, and manage a budget down to cloud cost. Pipeline 360 was a B2B
    demand-generation platform and Industry Dive was digital media and advertising, so the
    marketing-technology world is familiar territory even if the nonprofit mission is new. I learn a new
    domain fast and in the open.
  - >-
    I would welcome a conversation about where you want Feathr's product quality and its AI foundation
    to go, and how I would help get there.

closing: "Sincerely,"
signer: "Chris Monnat"
