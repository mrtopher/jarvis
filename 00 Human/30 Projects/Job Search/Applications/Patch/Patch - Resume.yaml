  - label: "Modernized a Live Stack"
    text: "Modernized a live platform with meaningful legacy components across search, content delivery, and publishing, holding reliability and site quality steady while product teams kept shipping to millions of readers."
  - label: "AI Into Production"
    text: "Turned scattered one-off scripts across an 800-plus employee organization into a shared, evaluated AI platform, then shipped agentic, LLM-backed systems to production with RAG retrieval and guardrails for hallucination and cost."
  - label: "Board-Legible Delivery"
    text: "Served as the sole technology voice in PE investor and board diligence while delivering a revenue-critical ad-buying platform from zero to production in under 90 days, protecting an 8-figure line without loosening reliability or security."

