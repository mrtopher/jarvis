target_title: "Vice President of Engineering"
target_subtitle: "Engineering Leadership | Platform Modernization | AI Strategy"

summary: >-
  Hands-on engineering executive with 20 years building the platforms high-traffic digital-media
  products run on, and the teams that keep them shipping. Ran engineering for a subscription
  publisher whose 100-plus properties reached millions of readers, modernizing a live platform
  with meaningful legacy components without dropping reliability. Runs an AI consulting practice today,
  putting agentic, LLM-backed systems into production with real evaluation and guardrails, the
  same way Patch uses AI to reach more communities with a lean team. Known for staying close to
  the code and the data, and for making technical plans a CEO and Board can fund and defend.

achievements:
