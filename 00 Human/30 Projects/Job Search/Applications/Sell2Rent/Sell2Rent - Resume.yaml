target_title: "Chief Technology Officer"
target_subtitle: "Technology Strategy | AI Strategy | Scaling Teams"

summary: >-
  Technology executive who runs engineering as a revenue engine. As SVP of Technology at Pipeline
  360, delivered a multi-tenant platform from zero to production in under 90 days, protecting an
  8-figure revenue line while owning the budget and board diligence. Now puts agentic AI into
  governed production at Dual Logic, and leads small distributed teams to systems that hold up at
  volume.

achievements:
  - label: "Platform Zero To Production"
    text: "Delivered a revenue-critical, multi-tenant platform on AWS from zero to production in under 90 days, protecting an 8-figure revenue line through a post-divestiture reset."
  - label: "Org Built From Zero"
    text: "Grew one team of 8 into five cross-functional teams of 40-plus across time zones, built the manager-of-managers layer, and lifted retention 15 percent with career ladders and structured feedback."
  - label: "Agentic AI In Production"
    text: "Moved agentic and LLM-backed systems from pilots into governed production, standardizing reusable components, evaluation harnesses, and guardrails so a small team ships AI that holds up instead of slop."
  - label: "Business And Board Credibility"
    text: "Served as the sole technology voice in PE investor and board diligence, owning the engineering budget, vendor evaluation, and cloud cost against total cost of ownership."

