date: "August 27, 2026"
salutation: "Dear Ms. Roberts,"
paragraphs:
  - "Your posting describes an engineering organization reimagining talent management with AI. Leading that kind of org is the work I do best. For twenty years I have built and run engineering teams that ship customer-facing products people rely on, most recently putting AI into governed production for enterprise clients at Dual Logic."
  - "I lead by building leaders. At Industry Dive I grew one team of eight into five cross-functional teams of more than forty, built the manager-of-managers layer from scratch, and developed managers and senior engineers with real career ladders and feedback. Retention rose fifteen percent. I have also made the hard portfolio calls, partnering with Product on where to invest limited capacity and owning the engineering budget as the sole technology voice in board diligence."
  - "I care about AI that holds up in front of customers. I ship it with guardrails, evaluation, and a human review loop, so the signals people act on are ones they can trust. You are betting on AI in service of the people doing the work, making them stronger at developing their own. I build for exactly that."
  - "People software is new to me, though the shape is familiar. It is multi-product B2B SaaS at scale, where trust and reliability decide whether customers stay. I would bring twenty years of building engineering organizations and a real belief in your mission to the Talent Engineering team. I would welcome the chance to talk."
closing: "Sincerely,"
signer: "Chris Monnat"
