    summary: "Owned technology strategy, platform architecture, and delivery across product, engineering, data, IT, security, and compliance for a newly independent, PE-backed, 100% remote org of 100+."
    bullets:
      - "Delivered a revenue-critical, multi-tenant platform from zero to production in under 90 days on AWS (EKS, Lambda, RDS), protecting an 8-figure revenue line through a post-divestiture reset."
      - "Consolidated siloed systems into shared, API-driven platform capabilities like authentication, roles and permissions, and workflows on Kubernetes and PostgreSQL, so teams reused instead of rebuilt and technical debt fell."
