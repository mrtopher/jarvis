target_title: "Head of Engineering"
target_subtitle: "Engineering Leadership | Organizational Design | AI Strategy"

summary: >-
  Engineering leader who came up building software and now builds the org around it. At Industry
  Dive, grew one team of 8 into five cross-functional teams of 40-plus behind a high-traffic
  platform serving millions, holding high availability through constant change. At Pipeline 360,
  shipped a multi-tenant AWS platform from zero to production in under 90 days. Known for scaling
  engineering orgs and the managers who run them, now delivering with agentic AI.

achievements:
  - label: "Org From One Team To Five"
    text: "Grew one team of 8 into five cross-functional teams of 40-plus across time zones, built the manager-of-managers layer, and lifted retention 15 percent with career ladders and structured feedback."
  - label: "Platform Zero To Production"
    text: "Delivered a revenue-critical, multi-tenant platform on AWS from zero to production in under 90 days, protecting an 8-figure revenue line through a post-divestiture reset."
  - label: "Agentic AI In Delivery"
    text: "Moved agentic and LLM-backed systems from pilots to governed production, standardizing reusable components, evaluation harnesses, and guardrails so a small team ships AI that holds up instead of slop."
  - label: "Reliability And Standards"
    text: "Held high availability across 100-plus high-traffic properties by maturing SRE, observability, and automated CI/CD, and set architecture and security standards that survived PE and board diligence."

