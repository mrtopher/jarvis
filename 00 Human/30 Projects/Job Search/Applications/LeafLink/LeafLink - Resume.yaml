  - company: "Dual Logic"
    location: "Remote"
    dates: "2026"
    role: "Chief Technology Officer & Managing Partner"
    summary: "Lead the technical side of a full-service AI consulting firm, owning technical vision, architecture, and delivery from discovery through production for enterprise clients."
    bullets:
      - "Own technology end to end for enterprise clients as a player-coach, putting agentic workflows, LLM-backed systems, and multi-agent orchestration into governed production as reusable, evaluated components."
      - "Champion LLM-powered code generation in delivery, standardizing reusable agent skills, evaluation harnesses, and DevSecOps guardrails that compress timelines while holding output quality and cost."
      - "Translate ambiguous executive goals into fundable engineering roadmaps and security-first, API-driven architectures, making the rebuild-versus-refactor calls and setting the milestones underneath them."
      - "Drove AI-forward development across an 800-plus employee SaaS org, turning one-off scripts into a shared, evaluated developer platform teams trusted."
