      - "Matured CI/CD and Infrastructure-as-Code with Terraform so teams provisioned and deployed through self-service instead of tickets, raising velocity and developer experience."
      - "Owned the engineering budget through major change, managing headcount, vendor and tooling spend, and cloud cost with a clear view of total cost of ownership, and served as the sole technology voice in PE investor and board diligence."
