date: "August 14, 2026"
salutation: "Dear Ms. Palmateer,"

paragraphs:
  - >-
    I am an engineering leader who came up building software and now builds the org around it. Your
    posting is honest about where LeafLink sits: past the size where informal norms hold, big enough
    to need real structure, with a new CEO and a mandate to reshape how engineering runs. That is the
    work I like most, and I have done the version of it that matters here.
  - >-
    At Industry Dive I built the engineering organization from one team of 8 into five cross-functional
    teams of 40-plus. The work that mattered was building the manager-of-managers layer so ownership
    and standards survived the growth instead of thinning out, the exact norms your posting says are
    easy to lose past 80 people. Retention went up 15 percent because people had a path and a manager
    who saw them, not because we asked them to grind harder.
  - >-
    Two things make a reset like that stick. At Pipeline 360 I cut a tangle of siloed systems down to
    shared, API-driven services so teams stopped rebuilding the same thing, which is how you buy back
    velocity while you reduce debt rather than trading one for the other. At Dual Logic I run delivery
    with agentic and LLM-backed systems in governed production, with real guardrails and evaluation,
    so a lean team ships more without shipping slop. That is the AI story I would bring to LeafLink,
    not a demo.
  - >-
    I have not run a cannabis marketplace, so I will not pretend that domain is second nature yet.
    What I have done is scale engineering orgs under real revenue and reliability pressure, own
    security and compliance through hard change, and manage a budget down to cloud cost. I learn a new
    domain fast and in the open, shipping as I go.
  - >-
    I would welcome a conversation about where you want LeafLink's engineering org and its AI
    foundation to go, and how I would help get there.

closing: "Sincerely,"
signer: "Chris Monnat"
