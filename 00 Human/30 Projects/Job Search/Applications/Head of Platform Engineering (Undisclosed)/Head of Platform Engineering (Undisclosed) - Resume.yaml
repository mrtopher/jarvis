target_title: "Head of Platform Engineering"
target_subtitle: "Platform Strategy | Engineering Leadership | Cloud Computing"

summary: >-
  Engineering executive with 20 years scaling high-traffic platforms and building the
  engineering organizations that run them. Founded and grew a platform org from 8 to 40+
  engineers, stood up a self-service, paved-road model that cut time-to-ship by 35%, and
  carried it across 100+ properties serving millions of users. At Pipeline 360, delivered a
  revenue-critical platform from zero to production in under 90 days, protecting an 8-figure
  revenue line during a post-divestiture reset. Known for running the internal developer
  platform as a product, holding the line on reliability, and connecting platform investment
  directly to how fast teams ship.

achievements:
  - label: "Scaled a Platform Org"
    text: "Founded and grew a platform and shared-services engineering org from 8 to 40+ engineers across 5 cross-functional teams, supporting 100+ properties serving millions of users."
  - label: "Platform-as-a-Product"
    text: "Ran the internal developer platform as a product, a paved-road, self-service model with automated provisioning and deployment. Cut average time-to-ship 35%, then spread it across the broader portfolio."
  - label: "Reliability Under Pressure"
    text: "Delivered a revenue-critical platform from zero to production in under 90 days on AWS, protecting an 8-figure revenue line without trading away security or reliability."
  - label: "Developer Enablement with AI"
    text: "Standardized reusable agent skills, evaluation harnesses, and security guardrails on the OpenAI SDK and MCP, driving AI-tooling adoption across an 800+ person SaaS engineering org."

