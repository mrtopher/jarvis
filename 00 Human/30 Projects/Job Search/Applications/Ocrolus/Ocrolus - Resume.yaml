target_title: "Vice President of Engineering"
target_subtitle: "Agentic AI Development | Engineering Leadership | Enterprise Architecture"

summary: >-
  Hands-on engineering executive who came up through architecture and never left the code.
  Runs the implementation side of an AI consulting practice today, building agentic and
  LLM-backed systems for enterprise clients while leading strategy, delivery, and the teams
  that ship it. Owns distributed platforms end to end: at Pipeline 360 shipped a
  revenue-critical platform on AWS from zero to production in under 90 days, protecting an
  8-figure line, and at Industry Dive scaled one team of 8 into five teams of 40+ serving
  100+ properties used by millions. Drove AI-augmented tooling across an 800+ engineer org
  by turning loose scripts into an evaluated, guardrailed platform teams trusted. Known for
  the player-coach seam, closing the gap from AI strategy to production without letting
  quality, reliability, or craft slip.

achievements:
  - label: "Player-Coach at the Code"
    text: "Build agentic and LLM-backed systems for enterprise clients hands-on while leading strategy and delivery, so technical decisions come from someone still in the weeds."
  - label: "AI Tooling, Governed at Scale"
    text: "Drove adoption of AI-augmented development tools across an 800+ engineer org by replacing one-off scripts with a shared platform, with evaluation and guardrails that held output quality and cost in check."
  - label: "Distributed Platform, Zero to Prod"
    text: "Shipped a revenue-critical platform on AWS from zero to production in under 90 days, protecting an 8-figure line without loosening reliability or security."
  - label: "Scaled the Org Across Zones"
    text: "Grew 1 team of 8 into 5 cross-functional teams of 40+ across time zones, standing up SRE, observability, and paved-road delivery that cut time-to-ship 35%."

