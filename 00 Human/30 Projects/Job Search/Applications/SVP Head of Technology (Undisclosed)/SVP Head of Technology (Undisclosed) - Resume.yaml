target_title: "SVP, Head of Technology"
target_subtitle: "Technology Strategy | AI Strategy | Product & Engineering Alignment"

summary: >-
  Technology executive who came up through architecture and still ships code. Leads product
  and engineering together, turning an existing AI foundation into commercial products rather
  than demos. Runs the technical side of an AI consulting practice today, building agentic and
  LLM-backed systems into production for enterprise clients. At Pipeline 360, a PE-backed SaaS
  company, delivered a revenue-critical, multi-tenant platform on AWS from zero to production
  in under 90 days, protecting an 8-figure line as the sole technology voice in investor and
  board diligence. At Industry Dive founded and scaled the engineering organization behind
  100-plus customer-facing properties used by millions, growing 8 people into five
  cross-functional teams of 40-plus. Known for deciding what gets built and what does not,
  then shipping AI into real products without letting reliability, security, or craft slip.

achievements:
  - label: "AI-Native Products"
    text: "Build agentic and LLM-backed systems into production for enterprise clients today, using RAG retrieval and vector search to turn an AI foundation into evaluated, commercial software rather than demos."
  - label: "Product and Engineering as One"
    text: "Lead product and engineering together across the full lifecycle, aligning roadmap, architecture, and delivery so a lean team ships continuously and decides deliberately what not to build."
  - label: "Platform Zero to Production"
    text: "Delivered a revenue-critical, multi-tenant platform on AWS from zero to production in under 90 days, protecting an 8-figure line without loosening reliability or security."
  - label: "Board and Enterprise Value"
    text: "Owned technology budget, security, and compliance end to end for a PE-backed company, serving as the sole technology voice in investor and board diligence."

