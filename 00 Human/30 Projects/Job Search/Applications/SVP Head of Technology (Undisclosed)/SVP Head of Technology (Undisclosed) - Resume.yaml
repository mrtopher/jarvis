  - company: "Dual Logic"
    location: "Remote"
    dates: "2026"
    role: "Chief Technology Officer & Managing Partner"
    summary: "Lead the technical side of a full-service AI consulting firm, owning technical vision, architecture, and delivery from discovery through production for enterprise clients."
    bullets:
      - "Own technology end to end for enterprise clients as a player-coach, building agentic workflows and LLM-backed systems with RAG retrieval and vector databases that turn an AI foundation into commercial, governed products."
      - "Lead product and engineering together, translating ambiguous CEO goals into fundable roadmaps and security-first architectures with clear build-versus-buy calls and delivery milestones."
      - "Design AI-native architectures and a secure SDLC that let lean teams ship continuously, standardizing reusable agent skills and DevSecOps guardrails for output quality, hallucination control, and cost governance."
      - "Drove adoption of AI-forward development across an 800-plus engineer SaaS org, turning one-off scripts into a shared, evaluated, guardrailed platform teams trusted."
