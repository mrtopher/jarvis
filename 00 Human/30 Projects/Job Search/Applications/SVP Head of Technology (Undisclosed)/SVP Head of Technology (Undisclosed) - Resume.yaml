  - "Change Management"

skill_groups:
  - label: "AI & Machine Learning"
    entries: "AI-native product development, generative AI, LLMs, agentic workflows, RAG, embeddings, vector databases, applied AI, machine learning, prompt engineering, evaluation and guardrails"
  - label: "Product & Platform Leadership"
    entries: "Product and engineering alignment, product strategy, technology roadmap, build-versus-buy, platform strategy, multi-tenant SaaS, platform modernization"
  - label: "Cloud & Architecture"
    entries: "Cloud-native architecture, AWS (Lambda, EKS, S3), GCP, Kubernetes, distributed systems, PostgreSQL, high availability, low-latency performance engineering"
  - label: "DevOps & Secure SDLC"
    entries: "Secure SDLC (SSDLC), Git-based CI/CD, DevOps, DevSecOps, observability, incident response, SRE, automated testing and QA"
  - label: "Leadership & Business"
    entries: "Technology strategy, enterprise budget management, board and executive communication, scaling teams, change management, agile delivery, data platforms"

