  - "Distributed Systems"
  - "Technology Roadmapping"
  - "Product Strategy"
  - "Information Security"

skill_groups:
  - label: "Platforms & Modernization"
    entries: "Multi-tenant SaaS, platform modernization, cloud architecture (AWS, GCP), distributed systems, REST APIs, CI/CD, DevOps, observability"
  - label: "AI & Machine Learning"
    entries: "AI-native development, applied AI, agentic workflows, LLM integrations, RAG, machine learning, prompt engineering, human-in-the-loop"
  - label: "Engineering Standards & Quality"
    entries: "Automated testing and QA/QC, release management, monitoring, incident response, SRE, secure SDLC, code review"
  - label: "Security & Compliance"
    entries: "Security-first architecture, information security, web application security, DevSecOps, compliance through change"
  - label: "Leadership & Delivery"
    entries: "Engineering leadership, hiring and mentoring senior teams, technology roadmap, agile delivery, board and executive communication"
  - label: "Web, Mobile & App Development"
    entries: "JavaScript (React, Next.js), Python, PHP, mobile delivery"

