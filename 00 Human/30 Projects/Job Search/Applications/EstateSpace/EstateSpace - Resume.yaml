    location: "Remote"
    dates: "2026"
    role: "Chief Technology Officer & Managing Partner"
    summary: "Lead the technical side of a full-service AI consulting firm, owning technical vision, architecture, and delivery from discovery through production for enterprise clients."
    bullets:
      - "Own technology end to end for enterprise clients as a player-coach: build agentic workflows and LLM-backed systems at the code level, turning client AI strategy into working software across tool orchestration, RAG retrieval, and model deployment."
