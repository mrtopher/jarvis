target_title: "Chief Technology Officer"
target_subtitle: "AI Strategy | Platform Strategy | Technology Leadership"

summary: >-
  Hands-on CTO who came up through architecture and never left the code. Owns technology
  end to end today for an AI consulting practice, building agentic and LLM-backed products
  for enterprise clients while setting strategy, delivery, and the senior teams that ship
  them. Turns a lean team into a shipping machine: at Pipeline 360 delivered a revenue-critical,
  multi-tenant platform on AWS from zero to production in under 90 days, protecting an 8-figure
  line, and at Industry Dive scaled one team of 8 into five cross-functional teams of 40+ serving
  100+ properties used by millions. Drove AI-native development across an 800+ engineer org,
  turning loose scripts into an evaluated, guardrailed platform teams trusted. Known for the
  player-coach seam, closing the gap from AI strategy to secure, production software without
  letting reliability or craft slip.

achievements:
  - label: "AI-Native at the Code"
    text: "Build agentic and LLM-backed systems for enterprise clients hands-on while owning strategy and delivery, designing AI-native architecture that lets a lean team ship continuously."
  - label: "Platform Zero to Production"
    text: "Delivered a revenue-critical, multi-tenant platform on AWS from zero to production in under 90 days, protecting an 8-figure line without loosening reliability or security."
  - label: "Modernization End to End"
    text: "Replaced manual ticket queues with self-service provisioning and automated CI/CD, then set the testing, QA, and release standards that cut time-to-ship 35% across a 40-plus engineering org."
  - label: "Scaled Team and Standards"
    text: "Grew 1 team of 8 into 5 cross-functional teams of 40+ across time zones, standing up SRE, observability, and incident response that held uptime through rapid change."

competencies:
  - "AI Strategy"
  - "Applied AI"
  - "Agentic AI Development"
  - "AI Integration"
  - "Technology Strategy"
  - "Platform Strategy"
