target_title: "VP of Engineering"
target_subtitle: "Engineering Leadership | AI Strategy | Platform Strategy"

summary: >-
  Engineering leader who came up through architecture and still ships code, running cross-functional
  squads as a manager of managers. At Industry Dive, grew one team of 8 into five teams of 40-plus
  that each own a product area end to end, cutting time-to-ship 35 percent with a paved-road
  platform. Known for making AI-assisted development the default without shipping slop.

achievements:
  - label: "AI as the Default"
    text: "Drove AI-assisted development across an 800-employee org, replacing scattered one-off scripts with a shared platform of reusable agent skills, evaluation harnesses, and review gates that hold quality as code volume climbs."
  - label: "Teams That Own the Journey"
    text: "Grew one team of 8 into five cross-functional squads of 40-plus across time zones, each owning a customer journey end to end, and lifted retention 15 percent with career ladders and clear standards."
  - label: "Quality Built In"
    text: "Cut average time-to-ship 35 percent with a paved-road platform of self-service provisioning, automated testing, and CI/CD, then spread it across 100-plus properties so squads shipped features instead of fighting infrastructure."
  - label: "Zero to Production"
    text: "Delivered a revenue-critical multi-tenant platform on AWS from zero to production in under 90 days, holding reliability and security while protecting an 8-figure revenue line."

