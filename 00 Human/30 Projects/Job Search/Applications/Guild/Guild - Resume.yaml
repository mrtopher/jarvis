target_title: "VP of Engineering"
target_subtitle: "Engineering Leadership | Platform Strategy | AI Strategy"

summary: >-
  Engineering executive with 20 years building the platforms high-traffic products run on, and the
  teams that keep them shipping. Owns product and platform engineering end to end, scaling and
  steadying cross-functional teams as a manager of managers. Runs an AI consulting practice today,
  putting agentic, LLM-backed systems into production with real evaluation and guardrails. Known for
  lightweight process and steady judgment, deciding when to harden the core and when to fund the next
  bet. Ready to bring that operating model to Guild, where product teams need to ship fast without
  wrestling the plumbing.

achievements:
  - label: "Platform Teams Build On"
    text: "Cut average time-to-ship 35 percent by building a paved-road internal platform with self-service provisioning, shared services, and automated testing, then spread the pattern across 100-plus properties so product teams shipped features without standing up their own infrastructure first."
  - label: "Shipped Under Pressure"
    text: "Delivered a revenue-critical demand-side ad-buying platform on The Trade Desk in under 90 days, holding reliability and security while protecting an 8-figure revenue line."
  - label: "Grew the Bench"
    text: "Lifted retention 15 percent while scaling a cross-functional org from 8 to 40-plus, coaching Directors and Engineering Managers on clear standards and career ladders, then standing up the Product Management function from scratch."
  - label: "AI Into Production"
    text: "Led AI-forward development across an 800-plus employee org, turning one-off scripts into a shared, evaluated platform, then put agentic, LLM-backed systems into production with RAG retrieval and guardrails for hallucination and cost."

