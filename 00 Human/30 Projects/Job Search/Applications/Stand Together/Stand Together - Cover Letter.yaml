date: "July 16, 2026"
salutation: "Dear Hiring Team,"

paragraphs:
  - >-
    Be The People needs someone who can take a platform an agency built and make an internal team its
    real owner. That transition, deciding what to build versus buy, integrating a staff-augmentation
    partner, and leading the knowledge transfer so the team can operate on its own, is the exact work I
    do every day. Most engineering leaders have lived on one side of that handoff. I have lived on both.
  - >-
    I run the technical side of an AI consulting practice, which means I own the build-versus-buy call
    for clients, manage the mix of internal and outside teams, and lead the transfer that lets a client
    operate a platform without us. I know how an agency codebase gets handed off, where the knowledge
    hides, and how to make an internal team self-sufficient without a rebuild. I would treat the Work &
    Co transition as a first-class project, not a cleanup task.
  - >-
    The rest of the role sits squarely in my experience. At Industry Dive I ran shared platform and SRE
    for 100-plus consumer-facing properties used by millions, standing up observability and incident
    response that held uptime through constant change, which is the continuous-availability bar a summer
    launch demands. At Pipeline 360 I delivered a revenue-critical platform on AWS from zero to production
    in under 90 days. I grew one team of eight into five cross-functional teams of forty and lifted
    retention 15%, so I know how to build the bench a platform this size needs.
  - >-
    I will be direct about the obvious question. My last few titles have been VP, SVP, and CTO, so a
    Director seat is a deliberate choice, not a fallback. I want the platform, the greenfield mandate,
    and the chance to set durable foundations without over-fixing, which is precisely what a pre-CTO
    environment offers. I am a player-coach who still writes code, and this is the kind of hands-on,
    foundation-setting work I do best.
  - >-
    I would welcome a conversation about the transition from Work & Co and where you want the internal
    engineering team to go from here.

closing: "Sincerely,"
signer: "Chris Monnat"
