target_title: "Director of Engineering"
target_subtitle: "Engineering Leadership | Software Architecture | AI Strategy"

summary: >-
  Engineering leader who came up through architecture and infrastructure and never left the code.
  Runs the technical side of an AI consulting practice today, which means owning the build-versus-buy
  call, integrating outside teams, and leading the knowledge transfer that lets clients operate a
  platform on their own. Has taken production platforms live under real deadlines and kept them up at
  consumer scale: at Pipeline 360 delivered a revenue-critical platform on AWS from zero to production
  in under 90 days, and at Industry Dive ran shared platform and SRE for 100-plus properties used by
  millions. Grew one team of 8 into five cross-functional teams of 40-plus, hiring senior engineers and
  lifting retention 15 percent. Known for setting durable foundations on a lean team without
  over-engineering, using AI-native tools to move faster.

achievements:
  - label: "Build vs Buy, Done Right"
    text: "Run the technical side of an AI consulting practice, managing the build-versus-buy mix and leading knowledge transfer from outside teams into client engineering so platforms can be owned and operated internally."
  - label: "Platform Zero to Production"
    text: "Delivered a revenue-critical, multi-tenant platform on AWS from zero to production in under 90 days, protecting an 8-figure line without loosening reliability or security."
  - label: "Reliability at Consumer Scale"
    text: "Ran shared platform and delivery for 100-plus properties used by millions, standing up SRE, observability, and incident response that held uptime through constant change."
  - label: "Scaled Team and Culture"
    text: "Grew one team of 8 into five cross-functional teams of 40-plus, hiring and growing senior engineers with career ladders and structured feedback that lifted retention 15 percent."

competencies:
  - "Engineering Leadership"
  - "Technology Leadership"
  - "Engineering Management"
  - "Team Building"
  - "Scaling Teams"
  - "Software Architecture"
  - "Distributed Systems"
  - "Platform Modernization"
  - "Technology Strategy"
  - "Technology Roadmapping"
  - "Applied AI"
  - "AI Integration"
  - "Agile Delivery"
  - "People Management"
  - "Information Security"

skill_groups:
  - label: "Infrastructure & Reliability"
    entries: "Back-end and infrastructure engineering, cloud (AWS, GCP), Kubernetes, distributed systems, SRE, observability, incident response, high availability, CI/CD, DevOps"
  - label: "Architecture & APIs"
    entries: "Software architecture, technical direction, data modeling, REST APIs, middleware, integration patterns, multi-tenant SaaS, platform modernization"
  - label: "Team & Vendor Leadership"
    entries: "Engineering leadership, hiring and retention, growing senior ICs, build-vs-buy decisions, managing contractors and staff augmentation, agency-to-internal knowledge transfer"
  - label: "AI & Machine Learning"
    entries: "AI-native development, AI-enabled tooling, applied AI, agentic workflows, LLM integrations, machine learning, prompt engineering"
  - label: "Delivery & Web"
    entries: "Agile delivery, two-week iteration cycles, roadmap execution, full-stack web, JavaScript (React, Next.js), Python, PHP"
  - label: "Security & Quality"
    entries: "Secure SDLC, information security, automated testing and QA, release management, code review"

experience:
