    location: "Remote"
    dates: "2026"
    role: "Chief Technology Officer & Managing Partner"
    summary: "Lead the technical side of a full-service AI consulting firm, owning technical direction, architecture, and delivery from discovery through production for enterprise clients."
    bullets:
      - "Own the build-versus-buy decision for clients, deciding when to build internally versus engage outside teams, managing the mix, and leading the knowledge transfer that lets internal teams operate a platform on their own."
      - "Set technical direction across architecture, data models, and integration patterns, then build the agentic workflows and back-end services hands-on as a player-coach."
      - "Use AI-native tools and practices to accelerate delivery, standing up reusable agent skills and DevSecOps-grade guardrails so lean teams ship continuously without loosening quality."
      - "Advise CEOs and technology leaders on durable technical foundations, translating ambiguous goals into phased roadmaps they can fund and defend."
